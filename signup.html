<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta name="referrer" content="no-referrer">
    <title>العودة للجامعة - إنشاء حساب</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-wrapper">
        <div class="auth-left">
            <div class="auth-brand">
                <div class="brand-icon"><i class="fas fa-graduation-cap"></i></div>
                <h1>العودة للجامعة</h1>
                <p>مساعدك الذكي لتنظيم حياتك الجامعية</p>
            </div>
            <div class="auth-features">
                <div class="feature-item"><i class="fas fa-check-circle"></i><span>تنظيم الواجبات والامتحانات</span></div>
                <div class="feature-item"><i class="fas fa-check-circle"></i><span>مساعد ذكي للتخطيط اليومي</span></div>
                <div class="feature-item"><i class="fas fa-check-circle"></i><span>جدولة التمارين والأنشطة</span></div>
                <div class="feature-item"><i class="fas fa-check-circle"></i><span>تقويم ذكي للمهام</span></div>
            </div>
        </div>
        <div class="auth-right">
            <div class="auth-container">
                <div class="auth-header">
                    <div class="mobile-brand"><i class="fas fa-graduation-cap"></i> العودة للجامعة</div>
                    <h2>إنشاء حساب جديد</h2>
                    <p>ابدأ رحلتك الجامعية معنا</p>
                </div>
                <form id="signupForm" class="auth-form">
                    <div class="form-group">
                        <label for="displayName"><i class="fas fa-user"></i> الاسم الكامل</label>
                        <input type="text" id="displayName" required placeholder="أدخل اسمك الكامل">
                    </div>
                    <div class="form-group">
                        <label for="email"><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
                        <input type="email" id="email" required placeholder="example@email.com" autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="password"><i class="fas fa-lock"></i> كلمة المرور</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="password" required placeholder="6 أحرف على الأقل" minlength="6" autocomplete="new-password" oninput="checkPasswordStrength(this.value)">
                            <button type="button" class="toggle-password" onclick="togglePassword('password', this)"><i class="fas fa-eye"></i></button>
                        </div>
                        <div class="password-strength" id="passwordStrength">
                            <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                            <span class="strength-text" id="strengthText"></span>
                        </div>
                        <small class="form-hint"><i class="fas fa-info-circle"></i> يجب أن تحتوي كلمة المرور على 6 أحرف على الأقل</small>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword"><i class="fas fa-lock"></i> تأكيد كلمة المرور</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="confirmPassword" required placeholder="أعد إدخال كلمة المرور" autocomplete="new-password">
                            <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)"><i class="fas fa-eye"></i></button>
                        </div>
                    </div>
                    <div id="errorMessage" class="error-message"></div>
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-user-plus"></i> إنشاء حساب
                    </button>
                </form>
                <div class="auth-footer">
                    <p>لديك حساب بالفعل؟ <a href="index.html">سجّل الدخول</a></p>
                </div>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
