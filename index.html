<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta name="referrer" content="no-referrer">
    <title>العودة للجامعة - تسجيل الدخول</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-wrapper">
        <div class="auth-left">
            <div class="auth-brand">
                <div class="brand-icon"><i class="fas fa-graduation-cap"></i></div>
                <h1>العودة للجامعة</h1>
                <p>مساعدك الذكي لتنظيم حياتك الجامعية</p>
            </div>
            <div class="auth-features">
                <div class="feature-item"><i class="fas fa-check-circle"></i><span>تنظيم الواجبات والامتحانات</span></div>
                <div class="feature-item"><i class="fas fa-check-circle"></i><span>مساعد ذكي للتخطيط اليومي</span></div>
                <div class="feature-item"><i class="fas fa-check-circle"></i><span>جدولة التمارين والأنشطة</span></div>
                <div class="feature-item"><i class="fas fa-check-circle"></i><span>تقويم ذكي للمهام</span></div>
            </div>
        </div>
        <div class="auth-right">
            <div class="auth-container">
                <div class="auth-header">
                    <div class="mobile-brand"><i class="fas fa-graduation-cap"></i> العودة للجامعة</div>
                    <h2>مرحباً بعودتك!</h2>
                    <p>سجّل دخولك للمتابعة</p>
                </div>
                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="email"><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
                        <input type="email" id="email" required placeholder="example@email.com" autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="password"><i class="fas fa-lock"></i> كلمة المرور</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
                            <button type="button" class="toggle-password" onclick="togglePassword('password', this)"><i class="fas fa-eye"></i></button>
                        </div>
                    </div>
                    <div id="errorMessage" class="error-message"></div>
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
                    </button>
                </form>
                <div class="auth-footer">
                    <p>ليس لديك حساب؟ <a href="signup.html">أنشئ حساباً جديداً</a></p>
                </div>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
